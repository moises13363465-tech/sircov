<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>SIRCOV - Recuperación</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* --- ESTILOS GENERALES --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url("{{ url_for('static', filename='img/imagen_39.jpg') }}");
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }

        .login-container {
            width: 850px;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            padding: 25px 40px;
            box-sizing: border-box;
        }

        .header-section {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-empresa {
            width: 270px;
            height: auto;
            margin-bottom: 10px;
        }

        h2 {
            color: #2c3e50;
            margin: 0;
            font-size: 26px;
            /* Fuente aumentada */
            text-transform: uppercase;
            border-bottom: 3px solid #004d99;
            padding-bottom: 8px;
        }

        /* --- GRILLA DEL FORMULARIO --- */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px 30px;
            margin-top: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .full-width {
            grid-column: span 2;
        }

        label {
            font-weight: 700;
            font-size: 14px;
            /* Fuente aumentada */
            color: #34495e;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        input,
        select {
            padding: 11px 14px;
            /* Un poco más de aire interno */
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            /* Fuente de entrada aumentada */
            width: 100%;
            box-sizing: border-box;
        }

        .password-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #888;
            font-size: 16px;
        }

        .requirements {
            font-size: 12px;
            color: #666;
            margin-top: -8px;
            font-style: italic;
        }

        /* --- SECCIÓN DEL BOTÓN (CENTRADITO Y MÁS CORTO) --- */
        .button-container {
            grid-column: span 2;
            display: flex;
            justify-content: center;
            /* Centra el botón */
            margin-top: 15px;
        }

        .btn-verificar {
            width: auto;
            /* Ya no ocupa el 100% */
            min-width: 280px;
            /* Tamaño fijo pero elegante */
            padding: 14px 30px;
            background: #34495e;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-verificar:hover {
            background: #004d99;
            transform: translateY(-1px);
        }

        .footer-link {
            grid-column: span 2;
            text-align: center;
            margin-top: 15px;
        }

        .footer-link a {
            color: #004d99;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }
    </style>
    <script src="{{ url_for('static', filename='js/darkmode.js') }}"></script>
</head>

<body>


    <div class="login-container">
        <div class="header-section">
            <img src="{{ url_for('static', filename='img/SIRCOVWM.png') }}" alt="Logo" class="logo-empresa">
            <h2>Recuperación de Cuenta</h2>
        </div>

        <form action="{{ url_for('recuperacion.verificar_y_actualizar') }}" method="POST" class="form-grid">

            <div class="form-group">
                <label>Usuario</label>
                <input type="text" name="username" placeholder="Escriba su usuario" value="{{ username | default('') }}"
                    required>
            </div>

            <div class="form-group">
                <label>Nueva Contraseña</label>
                <div class="password-wrapper">
                    <input type="password" id="new_password" name="new_password" placeholder="********" required>
                    <i class="fa-solid fa-eye toggle-password" id="eyeIcon"></i>
                </div>
                <!-- Medidor de seguridad -->
                <div style="margin-top: 8px;">
                    <div
                        style="display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 4px; font-weight: bold; color: #666;">
                        <span>Nivel de Seguridad:</span>
                        <span id="strength-text" style="color: #666;">Ninguno</span>
                    </div>
                    <div style="height: 5px; background: #eee; border-radius: 3px; overflow: hidden;">
                        <div id="strength-bar"
                            style="height: 100%; width: 0%; background: #e74c3c; transition: all 0.3s ease;"></div>
                    </div>
                </div>
                <!-- Texto de requisitos -->
                <div class="requirements" id="pass_reqs" style="margin-top: 5px;">* Mínimo 8 caracteres, mayúscula,
                    números y símbolos</div>
            </div>

            <div class="form-group">
                <label>Pregunta de Seguridad 1</label>
                <select name="pregunta1" required>
                    <option value="" {% if not pregunta1 %}selected{% endif %} disabled>Seleccione...</option>
                    <option value="1" {% if pregunta1=='1' %}selected{% endif %}>¿Cuál es tu color favorito?</option>
                    <option value="2" {% if pregunta1=='2' %}selected{% endif %}>¿Cuál es el nombre de tu primera
                        mascota?</option>
                    <option value="3" {% if pregunta1=='3' %}selected{% endif %}>¿En qué ciudad naciste?</option>
                    <option value="4" {% if pregunta1=='4' %}selected{% endif %}>¿Cuál es el nombre de tu abuelo
                        materno?</option>
                </select>
            </div>
            <div class="form-group">
                <label>Respuesta 1</label>
                <input type="text" name="respuesta1" placeholder="Su respuesta" value="{{ respuesta1 | default('') }}"
                    required>
            </div>

            <div class="form-group">
                <label>Pregunta de Seguridad 2</label>
                <select name="pregunta2" required>
                    <option value="" {% if not pregunta2 %}selected{% endif %} disabled>Seleccione...</option>
                    <option value="5" {% if pregunta2=='5' %}selected{% endif %}>¿Cómo se llamaba tu primera escuela?
                    </option>
                    <option value="6" {% if pregunta2=='6' %}selected{% endif %}>¿Cuál es la marca de tu primer coche?
                    </option>
                    <option value="7" {% if pregunta2=='7' %}selected{% endif %}>¿Nombre de tu mejor amigo de la
                        infancia?</option>
                    <option value="8" {% if pregunta2=='8' %}selected{% endif %}>¿Cuál es tu deporte favorito?</option>
                </select>
            </div>
            <div class="form-group">
                <label>Respuesta 2</label>
                <input type="text" name="respuesta2" placeholder="Su respuesta" value="{{ respuesta2 | default('') }}"
                    required>
            </div>

            <div class="form-group">
                <label>Pregunta de Seguridad 3</label>
                <select name="pregunta3" required>
                    <option value="" {% if not pregunta3 %}selected{% endif %} disabled>Seleccione...</option>
                    <option value="9" {% if pregunta3=='9' %}selected{% endif %}>¿Cuál es tu comida favorita?</option>
                    <option value="10" {% if pregunta3=='10' %}selected{% endif %}>¿Cuál es tu hobby o pasatiempo
                        principal?</option>
                    <option value="11" {% if pregunta3=='11' %}selected{% endif %}>¿Cuál es tu canción o banda
                        preferida?</option>
                    <option value="12" {% if pregunta3=='12' %}selected{% endif %}>¿A qué país te gustaría viajar?
                    </option>
                </select>
            </div>
            <div class="form-group">
                <label>Respuesta 3</label>
                <input type="text" name="respuesta3" placeholder="Su respuesta" value="{{ respuesta3 | default('') }}"
                    required>
            </div>

            <div class="button-container">
                <button type="submit" class="btn-verificar">ACTUALIZAR CREDENCIALES</button>
            </div>

            <div class="footer-link">
                <a href="{{ url_for('login') }}"><i class="fas fa-arrow-left"></i> Volver al Inicio</a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        const eyeIcon = document.getElementById('eyeIcon');
        const passInput = document.getElementById('new_password');

        eyeIcon.addEventListener('click', () => {
            const type = passInput.type === 'password' ? 'text' : 'password';
            passInput.type = type;
            eyeIcon.classList.toggle('fa-eye');
            eyeIcon.classList.toggle('fa-eye-slash');
        });

        passInput.addEventListener('input', function () {
            const val = this.value;
            let strength = 0;

            if (val.length > 5) strength += 1;
            if (val.length >= 8) strength += 1;
            if (/[A-Z]/.test(val)) strength += 1;
            if (/\d/.test(val)) strength += 1;
            if (/[@$!%*?&.]/.test(val)) strength += 1;

            const strengthBar = document.getElementById('strength-bar');
            const strengthText = document.getElementById('strength-text');
            const passReqs = document.getElementById('pass_reqs');

            if (val.length === 0) {
                strengthBar.style.width = '0%';
                strengthText.textContent = 'Ninguno';
                strengthText.style.color = '#666';
            } else if (strength <= 2) {
                strengthBar.style.width = '30%';
                strengthBar.style.background = '#e74c3c';
                strengthText.textContent = 'Débil';
                strengthText.style.color = '#e74c3c';
            } else if (strength === 3 || strength === 4) {
                strengthBar.style.width = '65%';
                strengthBar.style.background = '#f1c40f';
                strengthText.textContent = 'Media';
                strengthText.style.color = '#f1c40f';
            } else {
                strengthBar.style.width = '100%';
                strengthBar.style.background = '#2ecc71';
                strengthText.textContent = 'Fuerte';
                strengthText.style.color = '#2ecc71';
            }

            const PASS_REGEX = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*?&.])[A-Za-z\d@$!%*?&.]{8,}$/;
            if (PASS_REGEX.test(val)) {
                passReqs.style.color = '#2ecc71';
                passReqs.innerHTML = '<i class="fas fa-check-circle"></i> Cumple todos los requisitos';
            } else {
                passReqs.style.color = '#e74c3c';
                passReqs.innerHTML = '<i class="fas fa-times-circle"></i> Faltan requisitos (Letra, número, símbolo, min 8)';
            }
        });
    </script>
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <script>
        {% for category, message in messages %}
        {% if category == 'error' or category == 'danger' %}
        document.addEventListener('DOMContentLoaded', function () {
            let messageText = "{{ message }}";
            let targetGroup;
            let targetInput;

            if (messageText.includes("Usuario") || messageText.includes("encontrado")) {
                targetGroup = document.querySelectorAll('.form-group')[0]; // Grupo del Usuario
                targetInput = document.getElementsByName("username")[0];
            } else if (messageText.includes("contraseña") || messageText.includes("cumple")) {
                targetGroup = document.querySelectorAll('.form-group')[1]; // Grupo de Nueva Contraseña
                targetInput = document.getElementById("new_password");
            } else {
                targetGroup = document.querySelector('.button-container'); // Para errores generales (preguntas)
            }

            let errorMsg = document.createElement('p');
            errorMsg.style.color = '#e74c3c';
            errorMsg.style.fontSize = '0.85em';
            errorMsg.style.textAlign = targetInput ? 'left' : 'center';
            errorMsg.style.marginTop = '4px';
            errorMsg.style.marginBottom = '0px';
            if (!targetInput) {
                errorMsg.style.gridColumn = 'span 2'; // Centrado en las dos columnas
                errorMsg.style.marginBottom = '15px';
            }
            errorMsg.innerHTML = '<i class="fas fa-exclamation-circle"></i> ' + messageText;

            if (targetInput) {
                targetInput.style.border = '1px solid #e74c3c';
                targetInput.addEventListener('input', function () {
                    targetInput.style.border = '1px solid #ccc';
                    errorMsg.style.display = 'none';
                });
                targetGroup.appendChild(errorMsg);
            } else {
                targetGroup.parentNode.insertBefore(errorMsg, targetGroup);
            }
        });
        {% else %}
        var iconType = 'info';
        var titleText = 'Notificación';

        {% if category == 'success' %}
        iconType = 'success';
        titleText = '¡Éxito!';
        {% elif category == 'warning' %}
        iconType = 'warning';
        titleText = '¡Advertencia!';
        {% endif %}

        Swal.fire({
            icon: iconType,
            title: titleText,
            text: "{{ message }}",
            showConfirmButton: false,
            timer: 3000
        });
        {% endif %}
        {% endfor %}
    </script>
    {% endif %}
    {% endwith %}
</body>

</html>

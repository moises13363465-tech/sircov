<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIRCOV - Menú Principal</title>

    <!-- FAVICON (Ícono en la pestaña) - Ajustado para compatibilidad moderna -->
    <link rel="icon" href="{{ url_for('static', filename='img/favicon.ico') }}" sizes="any" type="image/x-icon">
    <!-- .ico (compatibilidad máxima) -->
    <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
    <!-- SVG (moderno y escalable, si tienes el archivo) -->
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='img/favicon-16x16.png') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
    <!-- iPhone/iPad -->
    <link rel="manifest" href="{{ url_for('static', filename='site.webmanifest') }}">
    <!-- PWA (opcional, si tienes el archivo) -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style2.css') }}">

    <!-- Resto de tu <style> original -->
    <style>
        /* --- BASE --- */
        body,
        html {
            margin: 0 !important;
            padding: 0 !important;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Inter', system-ui, sans-serif;
            background-color: #000;
        }

        /* --- BOTÓN HAMBURGUESA --- */
        .menu-trigger {
            display: none;
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 2500;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 48px;
            height: 48px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            font-size: 1.5rem;
            color: #ffffff;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .menu-trigger:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        /* --- CONTENEDOR DE BIENVENIDA --- */
        .welcome-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .welcome-content {
            margin-left: 270px;
            /* Sincronizado con el nuevo sidebar */
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 60px 40px;
            border-radius: 32px;
            text-align: center;
            color: #ffffff;
            width: 100%;
            max-width: 600px;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            animation: fadeInWelcome 0.8s ease-out;
        }

        @keyframes fadeInWelcome {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .welcome-content:hover {
            transform: translateY(-8px) scale(1.01);
            box-shadow: 0 35px 70px -15px rgba(0, 0, 0, 0.6);
            background: rgba(255, 255, 255, 0.12);
        }

        [data-theme="dark"] .welcome-content {
            background: rgba(15, 23, 42, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .welcome-content h1 {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            margin-bottom: 5px;
            background: linear-gradient(to bottom right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .welcome-content p {
            font-size: 1.25rem;
            line-height: 1.6;
            margin-bottom: 40px;
            color: rgba(255, 255, 255, 0.8);
        }

        .welcome-content .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.2), transparent);
            margin: 30px 0;
        }

        .welcome-content .status-label {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(52, 152, 219, 0.2);
            color: #3498db;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border: 1px solid rgba(52, 152, 219, 0.3);
        }

        /* --- OVERLAY --- */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1500;
            backdrop-filter: blur(8px);
        }

        @media (max-width: 1024px) {
            .welcome-content {
                margin-left: 270px;
                max-width: 450px;
                padding: 40px 30px;
            }

            .welcome-content h1 {
                font-size: 2.8rem;
            }
        }

        @media (max-width: 900px) {
            .sidebar {
                transform: translateX(-100%);
                backdrop-filter: blur(25px);
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .menu-trigger {
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .welcome-content {
                margin-left: 0;
                width: 90%;
                max-width: none;
            }

            .overlay.active {
                display: block;
            }
        }
    @media (max-width: 480px) {
        .welcome-content {
            padding: 25px 15px;
        }

        .welcome-content h1 {
            font-size: 1.8rem !important;
        }

        .sidebar {
            width: 85%;
        }
    }
    </style>
    <script src="{{ url_for('static', filename='js/darkmode.js') }}"></script>
</head>

<body>
    {% set active_page = 'inicio' %}
    {% include 'components/sidebar.html' %}

    <main class="welcome-container">
        <div class="welcome-content">
            <span class="status-label">Sistema Operativo</span>
            <h1>¡Bienvenido!</h1>
            <p>Hola, <strong>{{ session['usuario'] }}</strong>. Selecciona una opción del menú lateral para comenzar a
                gestionar la flota.</p>
            <div class="divider"></div>
            <small
                style="text-transform: uppercase; letter-spacing: 2px; opacity: 0.6; font-weight: 700; font-size: 0.7rem;">SIRCOV
                — SERVICIOS PARA LA INDUSTRIA</small>
        </div>
    </main>

    <script>
        function toggleSidebar() {
            const sb = document.getElementById('mainSidebar');
            const overlay = document.getElementById('overlay');
            sb.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        window.addEventListener('resize', () => {
            if (window.innerWidth > 900) {
                document.getElementById('mainSidebar').classList.remove('active');
                document.getElementById('overlay').classList.remove('active');
            }
        });
    </script>
</body>

</html>
